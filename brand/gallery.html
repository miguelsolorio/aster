<style>
/* Layout: a contact sheet. Two columns of 1200 x 630 stills, each numbered so one can be named. */
:root {
  --bg: #14100d; --fg: #efe6d8; --muted: #b5a998; --line: #33291f; --accent: #e9c98f; --card: #1c1612;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4ecdc; --fg: #1a1410; --muted: #6b5d4c; --line: #dccfb6; --accent: #8a5a1c; --card: #fbf6ea; color-scheme: light } }
:root[data-theme="light"] { --bg: #f4ecdc; --fg: #1a1410; --muted: #6b5d4c; --line: #dccfb6; --accent: #8a5a1c; --card: #fbf6ea; color-scheme: light }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
main { max-width: 1320px; margin: 0 auto; display: grid; gap: 40px }
.intro { display: grid; gap: 14px; max-width: 64ch }
.intro svg { height: 56px; width: auto; display: block; justify-self: start }
h1 { font: 400 clamp(32px, 5.4vw, 50px)/1.06 var(--serif); margin: 0; text-wrap: balance }
p { margin: 0; color: var(--muted) }
.sheet { display: grid; gap: 30px 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)) }
.still { margin: 0; display: grid; gap: 10px; min-width: 0 }
.still img { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; border-radius: 6px; background: var(--card) }
.still figcaption { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.num { font: 600 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--accent); letter-spacing: .06em }
.still strong { font: 400 18px/1.2 var(--serif) }
.note { color: var(--muted); font-size: 13px; margin-left: auto }
.still em { flex-basis: 100%; font: italic 400 17px/1.3 var(--serif); color: var(--accent) }
</style>

<h1>Twenty desert stills, twenty taglines</h1>
<p>Open desert with a mountain behind, and no town or oasis in frame. Every still carries a different candidate tagline, repeated under it. Stills and taglines are independent, so reply with the numbers of each that you like.</p>
