<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#14100d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aster" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark" />
    <title>Aster</title>
    <meta name="description" content="Take the long way. A calm desert to wander, glide and fly through." />
    <!-- What a shared link shows. The image is made from a capture at /social.html by brand/compose.py. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aster" />
    <meta property="og:title" content="Aster" />
    <meta property="og:description" content="Take the long way. A calm desert to wander, glide and fly through." />
    <meta property="og:url" content="https://miguelsolorio.com/projects/aster/" />
    <meta property="og:image" content="https://miguelsolorio.com/projects/aster/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lone wanderer on a rippled dune at golden hour, the sun setting behind a snow-capped mountain. Aster: take the long way." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aster" />
    <meta name="twitter:description" content="Take the long way. A calm desert to wander, glide and fly through." />
    <meta name="twitter:image" content="https://miguelsolorio.com/projects/aster/og.jpg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: #14100d;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        touch-action: none;
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no, so block pinch and long-press menus by hand.
      for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
        document.addEventListener(t, (e) => e.preventDefault());
      }
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('selectstart', (e) => e.preventDefault());
      document.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches.length > 1) e.preventDefault();
        },
        { passive: false },
      );
    </script>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
